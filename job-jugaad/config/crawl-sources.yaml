# Crawl sources for Job Jugaad
# LinkedIn: listing URLs only (no Easy Apply). Prefer company ATS apply links extracted from posts.
# web/firecrawl: public career pages + job boards via OmniRoute Firecrawl when available.

default_resume_track: general  # Avinash_Nandyala_Resume — main

queries:
  - software engineer
  - backend engineer
  - machine learning engineer
  - LLM engineer
  - applied AI engineer
  - ML infrastructure engineer

linkedin_search_urls:
  - https://www.linkedin.com/jobs/search/?keywords=software%20engineer&location=United%20States&f_TPR=r86400
  - https://www.linkedin.com/jobs/search/?keywords=backend%20engineer&location=United%20States&f_TPR=r86400
  - https://www.linkedin.com/jobs/search/?keywords=machine%20learning%20engineer&location=United%20States&f_TPR=r86400
  - https://www.linkedin.com/jobs/search/?keywords=LLM%20OR%20GenAI%20engineer&location=United%20States&f_TPR=r86400

web_job_boards:
  - name: Greenhouse directory sample
    urls:
      - https://boards.greenhouse.io/embed/job_board?for=stripe
      - https://boards.greenhouse.io/embed/job_board?for=anthropic
      - https://boards.greenhouse.io/embed/job_board?for=databricks
      - https://boards.greenhouse.io/embed/job_board?for=robinhood
      - https://boards.greenhouse.io/embed/job_board?for=coinbase
  - name: Lever postings
    urls:
      - https://jobs.lever.co/netflix
      - https://jobs.lever.co/spotify
  - name: Ashby boards
    urls:
      - https://jobs.ashbyhq.com/openai
      - https://jobs.ashbyhq.com/anthropic
      - https://jobs.ashbyhq.com/ramp

